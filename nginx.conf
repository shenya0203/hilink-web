# OpenWrt 通常以 root 运行，或者是 nobody，根据实际情况，通常不写或者 user root;
user root;
worker_processes auto;
pid /var/run/nginx.pid;

# 加载 Lua 模块 (OpenWrt 上必须显式加载，如果你的 nginx 是静态编译了 lua 则不需要这行)
# 如果启动报错 load_module，请确认是否安装了 nginx-mod-lua 并检查路径
# load_module /usr/lib/nginx/modules/ndk_http_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;
# error_log /var/log/nginx_error.log error;
error_log syslog:server=unix:/dev/log,tag=nginx error;

events {
    worker_connections 1024;
}

http {
    # 基础设置（绝对路径：配置会拷到 /tmp/nginx/ 再运行）
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Lua 模块路径设置 (如果有用到 require 引用其他 lua 文件)
    lua_package_path "/usr/lib/lua/?.lua;/usr/lib/lua/web_backend/?.lua;;";

    # =========================================
    # HTTP：仅跳转到 HTTPS（默认端口，nginx.init 可改 HTTPS 端口）
    # =========================================
    server {
        listen 80;
        server_name localhost;
        # 非 443 时 init 会改成 https://$host:PORT$request_uri
        return 301 https://$host$request_uri;
    }

    # =========================================
    # HTTPS：管理页与 API（无 BasicAuth，鉴权由 entry.lua Session 负责）
    # =========================================
    server {
        listen 443 ssl;
        server_name localhost;
        charset utf-8;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=15552000" always;

        # 设置上传文件大小限制
        client_max_body_size 16M;
        client_body_buffer_size 16M;

        root /www/gateway_web; # 前端Vue构建产物目录
        index index.html;

        # 1. API 路由分发给 Lua 脚本
        # 匹配 .cgi 结尾的请求 (GET/POST 参数配置)
        location ~ \.cgi$ {
            default_type application/json;
            content_by_lua_file /usr/lib/lua/web_backend/entry.lua;
        }

        # 2. 文件上传路由
        # 匹配 /upload/ 开头的请求
        location /upload/ {
            default_type application/json;
            content_by_lua_file /usr/lib/lua/web_backend/entry.lua;
        }

        # 前端静态文件
        location / {
	    if ($request_filename ~* .*\.(?:htm|html)$) {
	        add_header Cache-Control "no-cache, no-store, must-revalidate";
	    }

            try_files $uri $uri/ /index.html;
        }
    }
}
